  <style>
    :root {
      --ink: #20201d; --paper: #faf7ef; --paper-bright: #fffdf8;
      --coral: #ed5c61; --mint: #aad8bd; --yellow: #f1cf6b; --sky: #9fc9df;
      --muted: #716b63; --line: #d6cec0; --shadow: 4px 5px 0 var(--ink);
      --font-display: "Kaiti SC", "STKaiti", "KaiTi", serif;
      --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--font-body);
      display: flex; justify-content: center;
    }
    .app-shell {
      width: 100%; max-width: 480px; min-height: 100svh;
      background-color: var(--paper);
      background-image: radial-gradient(#cbbfae 0.55px, transparent 0.55px);
      background-size: 8px 8px;
      display: flex; flex-direction: column;
    }
    header { padding: 20px; text-align: center; border-bottom: 2px solid var(--ink); background: var(--paper-bright); }
    header h1 { margin: 0; font-family: var(--font-display); font-size: 24px; }
    
    .timeline-board {
      padding: 20px; background: var(--paper-bright); border-bottom: 2px solid var(--ink);
    }
    .slot-item {
      border: 2px dashed var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s;
    }
    .slot-item.active { border: 2px solid var(--coral); background: rgba(237, 92, 97, 0.05); }
    .slot-item.filled { border: 2px solid var(--ink); background: var(--mint); }
    .slot-time { font-weight: bold; font-size: 14px; width: 45px; }
    .slot-content { flex: 1; }
    .slot-content h3 { margin: 0; font-size: 16px; }
    .slot-content p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .slot-img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; border: 1.5px solid var(--ink); }

    .catalog-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tabs { display: flex; border-bottom: 2px solid var(--ink); }
    .tab { flex: 1; padding: 12px; text-align: center; font-weight: bold; cursor: pointer; background: var(--line); border-right: 2px solid var(--ink); }
    .tab:last-child { border-right: none; }
    .tab.active { background: var(--yellow); }

    .scroll-container { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
    .card {
      border: 2px solid var(--ink); border-radius: 8px; background: var(--paper-bright);
      overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.1s;
    }
    .card:active { transform: translate(2px, 2px); box-shadow: 2px 3px 0 var(--ink); }
    .card img { width: 100%; height: 100px; object-fit: cover; border-bottom: 2px solid var(--ink); }
    .card-info { padding: 8px; }
    .card-info h4 { margin: 0; font-size: 14px; }
    .card-info span { font-size: 10px; padding: 2px 4px; border: 1px solid var(--ink); border-radius: 3px; display: inline-block; margin-top: 6px; }

    .ticket-export-btn {
      margin: 20px; padding: 16px; background: var(--coral); color: #fff; font-weight: bold;
      text-align: center; border: 2px solid var(--ink); border-radius: 8px; box-shadow: var(--shadow);
      cursor: pointer; display: none;
    }
    .ticket-export-btn:active { transform: translate(2px, 2px); box-shadow: 2px 3px 0 var(--ink); }

    .dog-mascot { text-align: center; padding: 10px; }
    .dog-mascot img { width: 100px; height: auto; }
  </style>
</head>

    description: '站在高处看市民中心和天际线，视野大，照片也有深圳感。', tags: ['天际线', '城市景观', '免费']
  }
];



    let activeSlot = 0;
    let currentTab = 'food';
    const slots = [null, null, null];
    
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      if (tab === 'food') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
      } else {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
      }
      renderCatalog();
    }

    function renderCatalog() {
      const container = document.getElementById('scrollContainer');
      const data = currentTab === 'food' ? foodCatalog : playCards;
      container.innerHTML = data.map(item => `
        <div class="card" onclick="fillSlot('${item.id}')">
          <img src="${item.image}" style="object-fit: ${item.imageFit || 'cover'}">
          <div class="card-info">
            <h4>${item.title}</h4>
            <span>${item.tags[0]}</span>
          </div>
        </div>
      `).join('');
    }

    function fillSlot(id) {
      const data = currentTab === 'food' ? foodCatalog : playCards;
      const item = data.find(i => i.id === id);
      slots[activeSlot] = item;
      
      const slotEl = document.querySelector(`.slot-item[data-slot="${activeSlot}"]`);
      slotEl.classList.add('filled');
      slotEl.innerHTML = `
        <div class="slot-time">${['12:30', '14:00', '18:00'][activeSlot]}</div>
        <div class="slot-content">
          <h3>${item.title}</h3><p>${item.area}</p>
        </div>
        <img class="slot-img" src="${item.image}">
      `;
      
      // Auto advance
      document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('active'));
      if (activeSlot < 2) {
        activeSlot++;
        document.querySelector(`.slot-item[data-slot="${activeSlot}"]`).classList.add('active');
        if (activeSlot === 1) switchTab('play');
        if (activeSlot === 2) switchTab('food');
        
        document.getElementById('puppyText').innerText = "选得好！继续！";
      } else {
        // Done!
        document.getElementById('catalogSection').style.display = 'none';
        document.getElementById('exportBtn').style.display = 'block';
        document.getElementById('puppyImg').src = "assets/line-puppy-hug.gif";
        document.getElementById('puppyText').innerText = "排满啦！简直完美 ♡";
      }
    }

    // Allow clicking slot to re-select
    document.querySelectorAll('.slot-item').forEach(el => {
      el.addEventListener('click', function() {
        activeSlot = parseInt(this.getAttribute('data-slot'));
        document.querySelectorAll('.slot-item').forEach(e => e.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('catalogSection').style.display = 'flex';
        document.getElementById('exportBtn').style.display = 'none';
      });
    });

        function exportTicket() {
      const btn = document.getElementById('exportBtn');
      btn.innerText = "生成浪漫长图中...";
      
      // Populate the romantic ticket
      const timelineEl = document.getElementById('ticketTimeline');
      timelineEl.innerHTML = '';
      
      const labels = ['中午 · 阳光正好', '下午 · 漫步时光', '傍晚 · 夜色温柔'];
      slots.forEach((item, index) => {
        if(!item) return;
        timelineEl.innerHTML += `
          <div style="display: flex; margin-bottom: 25px; position: relative;">
            <div style="width: 2px; background: #ed5c61; position: absolute; left: 14px; top: 30px; bottom: -30px; ${index === 2 ? 'display:none;' : ''}"></div>
            <div style="width: 30px; height: 30px; border-radius: 50%; background: #ed5c61; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: sans-serif; font-size: 14px; z-index: 1;">${index+1}</div>
            <div style="margin-left: 20px; flex: 1;">
              <p style="margin: 0 0 5px; font-size: 12px; color: #716b63;">${labels[index]}</p>
              <h3 style="margin: 0 0 10px; font-size: 20px;">${item.title}</h3>
              <div style="background: white; padding: 6px; border: 1px solid #d6cec0; border-radius: 4px; transform: rotate(${index%2===0 ? '2deg' : '-2deg'}); box-shadow: 2px 2px 5px rgba(0,0,0,0.05);">
                <img src="${item.image}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 2px;">
                <p style="margin: 8px 0 4px; font-size: 12px; text-align: center; color: #716b63;">📍 ${item.area}</p>
              </div>
            </div>
          </div>
        `;
      });

      // Render the hidden ticket element instead of the app shell
      const target = document.getElementById('romanticTicket');
      target.style.left = '0'; // Bring it into viewport briefly to ensure proper rendering if needed, though html2canvas usually handles absolute hidden.
      
      html2canvas(target, {
         backgroundColor: null,
         scale: 2
      }).then(canvas => {
        target.style.left = '-9999px'; // Hide it again
        const link = document.createElement('a');
        link.download = 'Our-Romantic-Date-Ticket.png';
        link.href = canvas.toDataURL();
        link.click();
        btn.innerText = "已保存！快去发给TA吧 💌";
      });
    }

    renderCatalog();
  </script>
</body>
</html>
